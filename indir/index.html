<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#07152f" />
    <title>Misyon Akademi'yi İndir</title>
    <meta
      name="description"
      content="Misyon Akademi uygulamasını App Store veya Google Play'den indirin."
    />
    <link rel="icon" href="../assets/icons/logo.png" type="image/png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07152f;
        color: #fff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 10%, rgba(45, 83, 160, .45), transparent 44%),
          #07152f;
      }

      main {
        width: min(100%, 520px);
        text-align: center;
      }

      .logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
      }

      h1 { margin: 24px 0 10px; font-size: clamp(1.8rem, 7vw, 2.6rem); }
      p { margin: 0 auto 26px; color: #c5cee0; line-height: 1.6; }

      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 22px;
        border: 3px solid rgba(255, 255, 255, .18);
        border-top-color: #d9ad52;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .stores {
        display: grid;
        gap: 12px;
      }

      .store-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 54px;
        padding: 14px 20px;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 14px;
        background: rgba(255, 255, 255, .08);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      .store-link:first-child { background: #fff; color: #07152f; }
      .store-link:focus-visible { outline: 3px solid #d9ad52; outline-offset: 3px; }
      .note { margin-top: 22px; font-size: .88rem; color: #91a0bc; }
    </style>
    <script>
      (function () {
        var APP_STORE_URL = "https://apps.apple.com/us/app/komiserlik-misyon-koruma/id6760534055";
        var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.misyonakademi.paem&hl=tr";
        var userAgent = navigator.userAgent || navigator.vendor || "";
        var isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
        var isIOS = /iPad|iPhone|iPod/i.test(userAgent) || isIPadOS;
        var isAndroid = /Android/i.test(userAgent);

        if (isIOS) {
          window.location.replace(APP_STORE_URL);
        } else if (isAndroid) {
          window.location.replace(PLAY_STORE_URL);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <img class="logo" src="../assets/icons/logo.png" alt="Misyon Akademi" />
      <h1>Misyon Akademi'yi İndir</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p>Telefonunuza uygun uygulama mağazasına yönlendiriliyorsunuz.</p>
      <div class="stores">
        <a class="store-link" href="https://apps.apple.com/us/app/komiserlik-misyon-koruma/id6760534055">
          App Store'dan İndir
        </a>
        <a class="store-link" href="https://play.google.com/store/apps/details?id=com.misyonakademi.paem&amp;hl=tr">
          Google Play'den İndir
        </a>
      </div>
      <p class="note">Yönlendirme başlamazsa mağazanızı seçin.</p>
    </main>
  </body>
</html>
